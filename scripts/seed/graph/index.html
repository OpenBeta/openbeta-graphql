<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Openbeta Seed Graph Visualizer</title>
    <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #2c2c54;
      color: #eee;
      font-family: sans-serif;
    }

    #sigma-container {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #sigma-container:active {
      cursor: grabbing;
    }

    .link {
      fill: none;
      stroke: rgba(150, 150, 150, 0.3);
      stroke-width: 1.5px;
    }

    .node circle {
      stroke: #fff;
      stroke-width: 1px;
    }

    .node text {
      font-size: 10px;
      fill: #ecf0f1;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      z-index: 10;
      pointer-events: none;
    }

    #controls * {
      pointer-events: auto;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .color-box {
      width: 12px;
      height: 12px;
      margin-right: 8px;
      border-radius: 2px;
    }

    #status {
      margin-top: 10px;
      font-style: italic;
      color: #aaa;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #ff9f43;
    }
    </style>
  </head>

  <body>
    <div id="controls">
      <h3>Seed Graph</h3>
      <div id="legend">
        <div class="legend-item">
          <div class="color-box" style="background: #e67e22"></div> Area
        </div>
        <div class="legend-item">
          <div class="color-box" style="background: #f1c40f"></div> Climb
        </div>
        <div class="legend-item">
          <div class="color-box" style="background: #3498db"></div> Pitch
        </div>
        <div class="legend-item">
          <div class="color-box" style="background: #2980b9"></div> Content
        </div>
        <div class="legend-item">
          <div class="color-box" style="background: #9b59b6"></div> Organization
        </div>
      </div>
      <div id="search-container" style="margin-top: 10px">
        <input
          type="text"
          id="search-input"
          placeholder="Search node..."
          style="width: 100%; padding: 5px; background: #333; color: white; border: 1px solid #555; border-radius: 4px"
        >
      </div>
      <div id="status">Loading data...</div>
    </div>

    <div
      id="grade-container"
      style="position: absolute; top: 10px; right: 10px; bottom: 10px; background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px; z-index: 10; overflow-y: auto; overflow-x: auto; width: 400px; display: none"
    >
      <h3>Grade Pegboard</h3>
      <div
        id="grade-columns"
        style="display: flex; height: fit-content; min-height: 100%; align-items: flex-start"
      >
      </div>
    </div>

    <div id="sigma-container"></div>

    <script type="module" src="/seed-graph-client.js"></script>
  </body>
</html>
