<!DOCTYPE html>
<html>
  <head>
    <title>Graph Visualizer</title>
    <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #ff9f43;
      display: flex;
      flex-direction: column;
    }

    canvas {
      display: block;
      flex-grow: 1;
    }

    #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nodeTypeCheckboxes {
      display: flex;
      gap: 15px;
    }

    #nodeTypeCheckboxes label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    </style>
  </head>

  <body>
    <canvas id="graphCanvas"></canvas>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/seed-graph-client.js"></script>
    <div id="controls">
      <div id="nodeTypeCheckboxes"></div>
    </div>
  </body>
</html>
