scalar JSONObject

type Mutation {
  """
  Add one or more media objects. Each media object may contain one tag.
  """
  addMediaObjects(input: [NewMediaObjectInput]): [MediaWithTags]

  """
  Delete one media object.
  """
  deleteMediaObject(input: MediaDeleteInput!): Boolean!


  """
  Add an entity tag to a media.  Calling this function with the same
  mediaId, entityUuid, and entityType will update the topo data.
  """
  addEntityTag(input: MediaEntityTagInput): EntityTag!

  """
  Remove an entity tag from a media.
  """
  removeEntityTag(input: EntityTagDeleteInput!): Boolean!
}

type Query {
  """
  Get single media object.
  """
  media(input: MediaInput): MediaWithTags

  """
  Get recent media with tags group by users.
  """
  getMediaForFeed(input: MediaForFeedInput): [MediaByUsers]

  """
  Get all media belonging to a user (media with or without tags).
  """
  getUserMedia(input: UserMediaInput): [MediaWithTags]

  """
  Get media cursor with pagination support.  We only support forward cursor.
  See
  - https://graphql.org/learn/pagination/
  - https://relay.dev/graphql/connections.htm
  """
  getUserMediaPagination(input: UserMediaInput): UserMedia

  """
  Get media cursor with paginationg for an area
  """
  areaMediaPagination(input: AreaMediaInput): AreaMedia

  """
  Get media cursor with paginationg for a climb
  """
  climbMediaPagination(input: ClimbMediaInput): ClimbMedia

  """
  Get a list of users and their tagged photo count.
  """
  getTagsLeaderboard(limit: Int): TagsLeaderboard
}

"""
User media cursor with pagination support.
See https://graphql.org/learn/pagination/
"""
type UserMedia {
  userUuid: ID!
  mediaConnection: MediaConnection!
}

"""
Area media cursor with pagination support.
See https://graphql.org/learn/pagination/
"""
type AreaMedia {
  areaUuid: ID!
  mediaConnection: MediaConnection!
}

"""
Climb media cursor with pagination support.
See https://graphql.org/learn/pagination/
"""
type ClimbMedia {
  climbUuid: ID!
  mediaConnection: MediaConnection!
}

"""
Media connection.
See https://graphql.org/learn/pagination/
"""
type MediaConnection {
  edges: [MediaEdge!]!
  pageInfo: PageInfo!
}

"""
Media edge.
See https://graphql.org/learn/pagination/
"""
type MediaEdge {
  "Media object"
  node: MediaWithTags
  "Current node cursor.  The frontend can pass this value to the `after` input parameter to fetch the next page."
  cursor: ID!
}

type PageInfo {
  "True if there are more data after the last cursor."
  hasNextPage: Boolean!
  "Total number of items."
  totalItems: Int!
  "Not yet supported."
  endCursor: String
}

type TagsByUser {
  username: String
  userUuid: ID!
  total: Int!
}

type AllTimeTags {
  totalMediaWithTags: Int!
  byUsers: [TagsByUser]!
}

type TagsLeaderboard {
  allTime: AllTimeTags
}

"Media object metadata"
interface IMediaMetadata {
  """Unique id"""
  id: ID!

  """Width in pixels"""
  width: Int!

  """Height in pixels"""
  height: Int!

  """Valid format: jpeg, png, webp, avif"""
  format: String!

  """Upload time"""
  uploadTime: Date!

  """File size in bytes"""
  size: Int!
}

"All tags by an author"
type MediaByUsers {
  username: String
  userUuid: ID!
  mediaWithTags: [MediaWithTags]
}

"""A tag target (an area or a climb)"""
type EntityTag {
  id: ID!
  """Area or climb ID"""
  targetId: ID!
  """Climb name"""
  climbName: String
  """Area name"""
  areaName: String!

  """ancestors name"""
  ancestors: String!
  """Target type: 0: climb, 1: area"""
  type: Int!

  "Longitude"
  lng: Float!

  "Latitude"
  lat: Float!

  "Topo data"
  topoData: JSONObject
}

"Represent a media object"
type MediaWithTags implements IMediaMetadata {
  id: ID!
  username: String
  user: UserPublicProfile
  mediaUrl: String!
  width: Int!
  height: Int!
  format: String!
  uploadTime: Date!
  size: Int!
  entityTags: [EntityTag]
  lng: Float
  lat: Float
  camera: String
}

"""
There are two ways to use a media input, one to create a fully reified media object
and one to create a 'pending' media object. what this means is that you have not yet
uploaded the file yet, but you will be uploading it at some point in the near future.

The server will return you the media object and an endpoint to send it to with
a simple PUT request with the image data in the body.

When using this input type it is important to not partially specify the metadata. If you
are going to bother with width and height, the GQL endpoint will enforce specification of the
size and format (Or any other missing attributes, since you can save it a trip past the bucket.)
"""
input NewMediaObjectInput {
  """
  optionally supply the width AND height, otherwise the GQL endpoint will fetch the object
  from the database to get it
  """
  width: Int
  """
  optionally supply the width AND height, otherwise the GQL endpoint will fetch the object
  from the database to get it
  """
  height: Int
  """
  optionally the image size, otherwise the GQL endpoint will fetch the object
  from the database to get it. The size is given in bytes.
  """
  size: Int
  """
  Optionally specify the fileformat of this media, if you neglect to supply it
  the gql endpoint will fetch the object
  """
  format: String

  """
  If this media is already reified, you can set this and
  openbeta will recall a reference to it. If you need an upload endpoint,
  you may leave this field blank and/or supply an optional filename - though
  if you supply a URL the filename will be ignored.

  In the event that you do not supply a filename or a url, a random filename
  will be chosen for you, and your endpoint will be returned to you with this
  set.
  """
  mediaUrl: String
  """
  You can optionally supply a filename for this media object. This is usually a
  good idea if your user is expected to have unique filenames - as it should help
  to prevent duplication of media items (namespaced by user).
  """
  filename: String
  """
  By default, openbeta will mask the original filename provided to us, but if you would
  like to maintain the filename you can set this explicitly to 'false'.

  If you are performing some action where the image filenames are unlikely to be sensitive
  then this can be convienient to disable - since it will prevent double-upload of the same
  image.
  """
  maskFilename: Boolean

  entityTag: EmbeddedEntityInput
}

input EmbeddedEntityInput {
  "What this tag is pointing to (a climb/area)"
  entityId: ID!
  "0: climb, 1: area"
  entityType: Int!
}

"Input parameters for querying a single media object"
input MediaInput {
  id: ID!
}

"Input parameters for creating a new tag"
input MediaEntityTagInput {
  "Target media id"
  mediaId: ID!
  "What this tag is pointing to (a climb/area)"
  entityId: ID!
  "0: climb, 1: area"
  entityType: Int!
  "Optional topo data"
  topoData: JSONObject
}

"Input parameters for deleting a tag"
input EntityTagDeleteInput {
  mediaId: ID!
  tagId: ID!
}

"Input parameters for deleting a media"
input MediaDeleteInput {
  mediaId: ID!
}

"Input parameters for user media queries."
input UserMediaInput {
  "User UUID.  Ex: a0ca9ebb-aa3b-4bb0-8ddd-7c8b2ed228a5"
  userUuid: ID!
  "Max number of objects return.  Ignore when using with pagination query."
  maxFiles: Int
  "Number of objects per page (Default = 6)."
  first: Int
  "Returning page data after this cursor (exclusive).  Return the first page if omitted."
  after: ID
}

"Input parameters for area and climb media queries."
input AreaMediaInput {
  "Area UUID   Ex: 5f5b4b4b-0b3b-4b3b-8b3b-7b3b2b3b2b3b"
  areaUuid: ID!
  "Max number of objects return.  Ignore when using with pagination query."
  maxFiles: Int
  "Number of objects per page (Default = 6)."
  first: Int
  "Returning page data after this cursor (exclusive).  Return the first page if omitted."
  after: ID
}

"Input parameters for climb media queries."
input ClimbMediaInput {
  "Climb UUID   Ex: 5f5b4b4b-0b3b-4b3b-8b3b-7b3b2b3b2b3b"
  climbUuid: ID!
  "Max number of objects return.  Ignore when using with pagination query."
  maxFiles: Int
  "Number of objects per page (Default = 6)."
  first: Int
  "Returning page data after this cursor (exclusive).  Return the first page if omitted."
  after: ID
}
input MediaForFeedInput {
  maxUsers: Int
  maxFiles: Int
}
